<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка на комнату в общежитии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1ec; --surface: #fff; --ink: #17302b; --muted: #5d6f6a;
    --line: #cfd8d3; --accent: #e8a317; --accent-ink: #3a2800;
    --ok: #1f6f4a; --ok-bg: #e0f3e8; --bad: #b3261e; --bad-bg: #fbe4e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11201d; --surface: #1a2e2a; --ink: #e8f0ec; --muted: #9fb3ac;
      --line: #2e4540; --ok: #7fd6a8; --ok-bg: #173a2c; --bad: #ff8a80; --bad-bg: #402220;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Onest", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 24px; }
  form { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 20px; }
  label { display: block; font-size: .9rem; font-weight: 500; margin-bottom: 14px; }
  input {
    display: block; width: 100%; margin-top: 4px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; width: 100%;
    background: var(--accent); color: var(--accent-ink);
    border: 2px solid var(--ink); border-radius: 4px; padding: 10px 16px;
  }
  button:disabled { opacity: .6; cursor: wait; }

  #result { margin-top: 24px; }
  .verdict { padding: 14px 16px; border-radius: 6px; font-weight: 800; font-size: 1.15rem; margin-bottom: 12px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: flex; gap: 10px; }
  li .mark { font-weight: 800; }
  li.ok .mark { color: var(--ok); }
  li.bad .mark { color: var(--bad); }
  li small { display: block; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Заявка на комнату</h1>

  <form id="form">
    <label>ID студента
      <input name="student" type="number" min="1" required>
    </label>
    <label>Номер корпуса
      <input name="building" type="number" min="1" required>
    </label>
    <label>Номер комнаты
      <input name="room" type="number" min="1" required>
    </label>
    <button type="submit" id="btn">Проверить</button>
  </form>

  <div id="result" aria-live="polite"></div>
</div>
<script src="dorm.js"></script>
</body>
</html>
